name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Typecheck, lint, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgres://ci:ci@localhost:6543/ci
      DIRECT_URL: postgres://ci:ci@localhost:5432/ci
      AUTH_SECRET: ci-auth-secret-with-at-least-thirty-two-chars
      AUTH_URL: http://localhost:3000
      AUTH_RESEND_KEY: re_ci_dummy
      EMAIL_FROM: noreply@example.com
      ANTHROPIC_API_KEY: sk-ant-ci-dummy
      INNGEST_EVENT_KEY: ci-event-key
      INNGEST_SIGNING_KEY: ci-signing-key
      R2_ACCOUNT_ID: ci
      R2_ACCESS_KEY_ID: ci
      R2_SECRET_ACCESS_KEY: ci
      R2_BUCKET: relomate-ci
      R2_ENDPOINT: https://ci.r2.cloudflarestorage.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

  tests:
    name: Vitest serial
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Postgres runs as a service container on the runner itself. Tests previously
    # pointed at a remote Supabase pooler in another region; the per-query
    # transatlantic round-trip pushed migration-replay and DB-backed tests past
    # vitest's 5s/10s timeouts (non-deterministically). A local container removes
    # the network latency and retires the EMAXPOOLSREACHED pooler-saturation flake.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: relomate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/relomate_test
      DIRECT_URL: postgres://postgres:postgres@localhost:5432/relomate_test
      AUTH_SECRET: ci-test-secret-with-at-least-thirty-two-chars
      ANTHROPIC_API_KEY: sk-ant-ci-dummy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run full Vitest suite serially
        run: pnpm exec vitest run --no-file-parallelism
